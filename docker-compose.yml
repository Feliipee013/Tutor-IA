services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sau-bot
    # Três tentativas absorvem queda transitória do Ollama no host; depois disso
    # o serviço para. Com `unless-stopped`, o sys.exit(1) da checagem de
    # pré-requisito virava loop infinito: a falha alta do ADR-0002 rebornava
    # como reinício silencioso, que é o oposto do que ela promete.
    restart: on-failure:3
    ports:
      - "${BOT_PORT:-8000}:8000"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_ALLOW_CPU=${OLLAMA_ALLOW_CPU:-false}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-30}
      - VRAM_TOTAL_MIB=${VRAM_TOTAL_MIB:-}
      - BOT_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
