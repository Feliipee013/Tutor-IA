services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sau-bot
    # Três tentativas absorvem queda transitória do Ollama no host; depois disso
    # o serviço para. Com `unless-stopped`, o sys.exit(1) da checagem de
    # pré-requisito virava loop infinito: a falha alta do ADR-0002 rebornava
    # como reinício silencioso, que é o oposto do que ela promete.
    restart: on-failure:3
    ports:
      - "${BOT_PORT:-8000}:8000"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_ALLOW_CPU=${OLLAMA_ALLOW_CPU:-false}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-30}
      - VRAM_TOTAL_MIB=${VRAM_TOTAL_MIB:-}
      - BOT_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # O canal do Telegram, como serviço próprio e não como thread do `bot`. Ele
  # virou o dono do turno na #8: o acuse sai primeiro e o grafo responde depois,
  # com o modelo alcançado no host pelo mesmo caminho que o `bot` usa. Continua
  # sem a checagem de pré-requisito do `bot` de propósito: este serviço é o canal
  # do Telegram, e ele tem que ficar no ar para acusejar Aluno mesmo com o Ollama
  # fora.
  webhook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sau-webhook
    # Pelo pacote, e não por `sau.telegram.webhook`: `python -m <arquivo>`
    # carrega o módulo como `__main__` e o log do handler sai sem o nome dele.
    command: ["python", "-m", "sau.telegram"]
    # Sem restart automático: sem as credenciais do Telegram o serviço falha
    # alto na subida, e reiniciar em laço só repete a mesma mensagem de erro.
    restart: "no"
    ports:
      - "${TELEGRAM_WEBHOOK_PORT:-8080}:8080"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_WEBHOOK_SECRET_TOKEN=${TELEGRAM_WEBHOOK_SECRET_TOKEN:-}
      - TELEGRAM_WEBHOOK_PORT=8080
      # Mesmo modelo e mesmo relógio do `bot`. A `OLLAMA_ALLOW_CPU` e a
      # `VRAM_TOTAL_MIB` ficam de fora de propósito: a checagem de pré-requisito
      # é do `bot` (ADR-0002), e ela não pega o `webhook` junto. O
      # `OLLAMA_HOST=0.0.0.0` do host continua obrigatório e o `extra_hosts`
      # abaixo é o mesmo alias que o `bot` usa.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # O histórico da conversa vive num arquivo, e sem volume nomeado ele
      # desapareceria a cada `docker compose down` — que é a memória do Aluno
      # perdurada. O volume é do `webhook` e não do `bot` porque o `bot` não roda
      # turno: ele não tem conversa nenhuma para guardar.
      - CONVERSA_CAMINHO=/var/lib/sau/conversas.db
      - CONVERSA_TTL_MINUTOS=${CONVERSA_TTL_MINUTOS:-30}
    volumes:
      - conversas:/var/lib/sau
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  # Nomeado, e não um bind de diretório do repositório: o arquivo do SQLite fica
  # sob controle do Docker, não entre os arquivos que o git enxerga.
  conversas:
