[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sau"
version = "0.1.0"
description = "S.A.U. - Sistema de Apoio Unopar (agente de orientação de estágios)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.0",
    "httpx>=0.27.0",
    "langgraph>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sau*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# As regras de continuation-line do pycodestyle (`E12x`) são preview do ruff e
# não entram no `E` acima. Sem elas, o lint passa verde em bloco dict/list com o
# corpo na mesma indentação da linha de abertura — o que aconteceu na #13 e só
# apareceu na leitura. Habilitar `preview = true` traria `E12x` e outras em
# preview; fica como dívida, porque ligá-las muda o resultado em código antigo.

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = [
    "^docs/",
    "^.venv/",
]
